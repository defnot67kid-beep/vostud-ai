<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vostud AI - Support Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0c29;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
            font-size: 0.9em;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn-support { background: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card h3 { margin-bottom: 15px; color: #ddd; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th { color: #888; font-weight: 600; font-size: 0.8em; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .badge {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: 600;
        }
        .badge-open { background: rgba(74,222,128,0.2); color: #4ade80; }
        .badge-in_progress { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .badge-closed { background: rgba(248,113,113,0.2); color: #f87171; }
        .badge-pending { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .badge-approved { background: rgba(74,222,128,0.2); color: #4ade80; }
        .badge-denied { background: rgba(248,113,113,0.2); color: #f87171; }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 12px;
            background: rgba(0,0,0,0.9);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            z-index: 1000;
            max-width: 400px;
        }
        .toast.show { display: block; animation: slideUp 0.3s ease; }
        .toast.success { border-color: rgba(74,222,128,0.3); }
        .toast.error { border-color: rgba(248,113,113,0.3); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input, textarea {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.9em;
            width: 100%;
        }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        textarea { min-height: 80px; resize: vertical; }
        .loading { text-align: center; color: #666; padding: 40px; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-prompt {
            color: #fbbf24;
            padding: 30px;
            text-align: center;
        }
        .login-prompt a { color: #667eea; text-decoration: none; }
        .login-prompt a:hover { text-decoration: underline; }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
        }
        .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            table { font-size: 0.75em; }
            th, td { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💬 Vostud AI Support</h1>
            <div class="header-actions">
                <div id="userDisplay" class="user-info" style="display: none;">
                    <img id="userAvatar" class="avatar" src="" alt="">
                    <span id="usernameDisplay"></span>
                </div>
                <button class="btn btn-secondary" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
                <a href="/platform" class="btn btn-secondary">Dashboard</a>
            </div>
        </div>

        <!-- Support Content -->
        <div id="supportContent">
            <!-- Login Prompt (shown when not logged in) -->
            <div id="loginPrompt" class="card">
                <div class="login-prompt">
                    <p style="font-size: 1.2em;">🔑 Please login to access support</p>
                    <p style="margin-top: 10px;"><a href="/platform">Go to Platform</a> to login</p>
                </div>
            </div>

            <!-- Support Dashboard (shown when logged in) -->
            <div id="supportDashboard" style="display: none;">
                <!-- Create Ticket -->
                <div class="card">
                    <h3>📝 Create Support Ticket</h3>
                    <div class="flex" style="flex-direction: column; gap: 10px;">
                        <input type="text" id="ticketSubject" placeholder="Subject">
                        <select id="ticketCategory">
                            <option value="general">General</option>
                            <option value="suspension">Suspension Appeal</option>
                            <option value="billing">Billing</option>
                            <option value="technical">Technical Issue</option>
                            <option value="feature">Feature Request</option>
                        </select>
                        <textarea id="ticketMessage" placeholder="Describe your issue..."></textarea>
                        <button class="btn btn-primary" onclick="createTicket()">Submit Ticket</button>
                    </div>
                </div>

                <!-- Tickets List -->
                <div class="card">
                    <div class="flex" style="margin-bottom: 15px;">
                        <h3 style="margin: 0;">📋 Your Tickets</h3>
                        <button class="btn btn-secondary" onclick="loadTickets()">🔄 Refresh</button>
                    </div>
                    <div id="ticketsTableContainer"><div class="loading">Loading tickets...</div></div>
                </div>

                <!-- Appeal Status -->
                <div class="card">
                    <h3>📝 Appeal Status</h3>
                    <div id="appealStatus">Loading appeal status...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ?
            'http://localhost:8000' : 'https://vostud-ai.onrender.com';

        let currentUser = null;
        let isAuthenticated = false;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // ============================================
        // API REQUEST (Supports both cookie and API key)
        // ============================================
        async function apiRequest(endpoint, method = 'GET', body = null) {
            // Check for API key in localStorage
            const apiKey = localStorage.getItem('vostud_api_key');
            
            const headers = { 'Content-Type': 'application/json' };
            if (apiKey) {
                headers['X-API-Key'] = apiKey;
            }

            const options = {
                method,
                headers,
                credentials: 'include'  // Sends cookie for OAuth
            };
            if (body) options.body = JSON.stringify(body);

            const response = await fetch(`${API_URL}${endpoint}`, options);

            if (response.status === 401 || response.status === 403) {
                // Try to refresh OAuth session
                try {
                    const meResponse = await fetch(`${API_URL}/auth/me`, {
                        credentials: 'include'
                    });
                    if (meResponse.ok) {
                        // Retry with fresh cookie
                        return apiRequest(endpoint, method, body);
                    }
                } catch (e) {}

                isAuthenticated = false;
                showLoginPrompt();
                return null;
            }

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.detail || data.message || 'Request failed');
            }

            isAuthenticated = true;
            return response.json();
        }

        // ============================================
        // SHOW/HIDE LOGIN PROMPT
        // ============================================
        function showLoginPrompt() {
            document.getElementById('loginPrompt').style.display = 'block';
            document.getElementById('supportDashboard').style.display = 'none';
            document.getElementById('userDisplay').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('loginPrompt').style.display = 'none';
            document.getElementById('supportDashboard').style.display = 'block';
            document.getElementById('userDisplay').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'inline-block';
        }

        // ============================================
        // CREATE TICKET
        // ============================================
        async function createTicket() {
            const subject = document.getElementById('ticketSubject').value.trim();
            const category = document.getElementById('ticketCategory').value;
            const message = document.getElementById('ticketMessage').value.trim();

            if (!subject || !message) {
                showToast('Please fill in subject and message.', 'error');
                return;
            }

            try {
                const result = await apiRequest('/api/support/ticket', 'POST', {
                    subject,
                    category,
                    message
                });

                showToast(result.message || 'Ticket created!', 'success');
                document.getElementById('ticketSubject').value = '';
                document.getElementById('ticketMessage').value = '';
                loadTickets();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        // ============================================
        // LOAD TICKETS
        // ============================================
        async function loadTickets() {
            try {
                const data = await apiRequest('/api/support');
                if (!data) return;
                const container = document.getElementById('ticketsTableContainer');

                if (!data.tickets || data.tickets.length === 0) {
                    container.innerHTML = '<div style="color: #666; padding: 20px; text-align: center;">No tickets found.</div>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <thead><tr>
                            <th>ID</th>
                            <th>Subject</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Messages</th>
                        </tr></thead>
                        <tbody>
                            ${data.tickets.map(t => `
                                <tr onclick="viewTicket('${t._id}')" style="cursor: pointer;">
                                    <td style="font-size: 0.8em; color: #888;">${t._id.slice(-8)}</td>
                                    <td>${t.subject}</td>
                                    <td><span class="badge badge-${t.category || 'general'}">${t.category || 'general'}</span></td>
                                    <td><span class="badge badge-${t.status || 'open'}">${t.status || 'open'}</span></td>
                                    <td style="font-size: 0.8em; color: #888;">${new Date(t.created_at).toLocaleDateString()}</td>
                                    <td>${(t.messages || []).length}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                document.getElementById('ticketsTableContainer').innerHTML = `<div style="color: #f87171; padding: 20px;">Error: ${error.message}</div>`;
            }
        }

        // ============================================
        // VIEW TICKET
        // ============================================
        async function viewTicket(ticketId) {
            try {
                const data = await apiRequest(`/api/support/ticket/${ticketId}`);
                if (!data) return;

                let messagesHtml = data.messages ? data.messages.map(m =>
                    `<div style="padding: 8px 12px; margin: 5px 0; background: rgba(255,255,255,0.05); border-radius: 6px;">
                        <strong>${m.from === 'user' ? '👤 You' : '🛡️ Support'}</strong>
                        <span style="color: #888; font-size: 0.8em; margin-left: 10px;">${new Date(m.timestamp).toLocaleString()}</span>
                        <p style="margin-top: 5px;">${m.message}</p>
                    </div>`
                ).join('') : 'No messages.';

                const reply = prompt('Reply to ticket (type message or cancel):');
                if (reply && reply.trim()) {
                    await apiRequest(`/api/support/ticket/${ticketId}/message`, 'POST', { message: reply.trim() });
                    showToast('Reply sent!', 'success');
                    loadTickets();
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        // ============================================
        // LOAD APPEAL STATUS
        // ============================================
        async function loadAppealStatus() {
            try {
                const data = await apiRequest('/support/appeal');
                if (!data) return;
                const container = document.getElementById('appealStatus');

                if (data.status === 'no_appeal') {
                    container.innerHTML = `<div style="color: #666;">No appeal found. You can submit one if your account is suspended.</div>`;
                    return;
                }

                container.innerHTML = `
                    <div style="padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                        <p><strong>Status:</strong> <span class="badge badge-${data.status || 'pending'}">${data.status || 'pending'}</span></p>
                        <p><strong>Message:</strong> ${data.message || 'N/A'}</p>
                        <p><strong>Submitted:</strong> ${new Date(data.created_at).toLocaleString()}</p>
                        ${data.resolved_at ? `<p><strong>Resolved:</strong> ${new Date(data.resolved_at).toLocaleString()}</p>` : ''}
                        ${data.admin_notes ? `<p><strong>Admin Notes:</strong> ${data.admin_notes}</p>` : ''}
                    </div>
                `;
            } catch (error) {
                document.getElementById('appealStatus').innerHTML = `<div style="color: #f87171;">Error loading appeal status: ${error.message}</div>`;
            }
        }

        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            localStorage.removeItem('vostud_api_key');
            document.cookie = 'access_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.href = '/platform';
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        async function init() {
            // Check if user is logged in via cookie or API key
            try {
                const meResponse = await fetch(`${API_URL}/auth/me`, {
                    credentials: 'include',
                    headers: {
                        'X-API-Key': localStorage.getItem('vostud_api_key') || ''
                    }
                });

                if (meResponse.ok) {
                    const data = await meResponse.json();
                    if (data.authenticated) {
                        currentUser = data.user;
                        isAuthenticated = true;
                        
                        // Update user display
                        document.getElementById('usernameDisplay').textContent = currentUser?.email || currentUser?.name || 'User';
                        if (currentUser?.picture) {
                            document.getElementById('userAvatar').src = currentUser.picture;
                        }
                        
                        showDashboard();
                        await loadTickets();
                        await loadAppealStatus();
                        return;
                    }
                }
            } catch (e) {
                console.log('Auth check error:', e);
            }

            // Not logged in - show login prompt
            showLoginPrompt();
        }

        // Run init when page loads
        init();
    </script>
</body>
</html>
